name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      # Chromium, Firefox and WebKit (the engine of Safari on macOS and every iOS browser).
      - run: npm run test:e2e
        env:
          PW_ALL_BROWSERS: '1'
      - name: Page snapshots of failed e2e tests
        if: failure()
        run: find test-results -name error-context.md -exec sh -c 'echo "=== $1"; head -c 6000 "$1"' _ {} \;
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
